[package]
name = "drama-warden-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
axum = "0.8"
drama-warden-plugin-protocol = { path = "../plugin-protocol" }
serde.workspace = true
serde-saphyr = { version = "=1.1.0", default-features = false, features = ["deserialize"] }
serde_json.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["any", "runtime-tokio-rustls", "sqlite", "mysql"] }
subtle = "2"
tokio.workspace = true
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
reqwest = { version = "0.13.5", features = ["json"] }
ring = "0.17"
hex = "0.4"
unicode-normalization = "0.1"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
