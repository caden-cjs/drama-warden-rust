# Non-secret application defaults. Copy this file to config/config.yaml to customize it.
# Process environment values take precedence over this file.

server:
  timeZone: Asia/Shanghai

database:
  driver: sqlite
  sqlitePath: ./data/drama-warden.sqlite
  mysql:
    host: mysql
    port: 3306
    database: drama_warden
    user: drama_warden
    connectionLimit: 10
    connectAttempts: 30
    connectDelayMs: 1000
    connectTimeoutMs: 5000

storage:
  local:
    enabled: true
    root: ./data/media
    shareRoot: ./data/shares
  quark:
    # Optional: requires INCLUDE_QUARK_CLI=true when building the Docker image.
    # Configure CLI path, authorization state directory, and recycle directory from /plugins.
  pan115:
    # Optional: requires INCLUDE_115_CLI=true when building the Docker image.
    # Configure CLI path, Cookie, and rate limits from /plugins.

indexer:
  smartstrm:
    # Set both non-secret fields and SMARTSTRM_WEBHOOK_TOKEN in .env to enable this provider.
    baseUrl: null
    taskName: null

subtitles:
  workerEnabled: true
  assrtEnabled: false
  openSubtitlesUserAgent: drama-warden v0.1.0

automation:
  enabled: false
  scanIntervalMinutes: 30
  autoProcess: false

plugins:
  # Rust protocol-v1/v2 child process plugins. Keep credentials in .env.
  commands: []
  # Legacy Node ESM/npm modules are not loaded by the Rust server.
  modules: []
