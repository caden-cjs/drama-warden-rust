name: 功能建议
description: 描述一个自托管用户场景和改进方向
title: "[建议] "
body:
  - type: markdown
    attributes:
      value: |
        请描述通用的自托管场景。不要在表单中提供账号信息、Cookie、Webhook、分享链接、个人路径或真实媒体数据。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前流程遇到什么困难？谁会遇到？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的改进
      description: 描述用户可见的行为或结果。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方式（可选）
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私检查
      options:
        - label: 我确认没有包含凭据、真实分享链接、个人路径、数据库或真实媒体数据。
          required: true
